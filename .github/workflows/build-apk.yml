name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Run SMS parser and payment notification regression tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Name the installable APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Spend-Wisely-1.2.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: Spend-Wisely-1.2.apk
          if-no-files-found: error

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Spend-Wisely 1.2 - automatic payment alerts (build ${{ github.run_number }})
          body: |
            Debug APK built from commit ${{ github.sha }}.
            Restores automatic incoming-bank-SMS detection, pending-payment notifications, and the payment popup.
            SMS inbox read access is not requested. New incoming SMS access and notification access are required.
            Enable Appear on top in Settings & setup for the popup over another app, then tap Test popup.
            Full-screen access is optional; a denied lock-screen permission does not block ordinary payment notifications.
            This uses the original com.expensetracker.app identity, separate from the manual-only com.pranav.spendwisely rebuild.
            Existing records in that separate rebuild remain there. Export a CSV before uninstalling any version.
            Download Spend-Wisely-1.2.apk below. Built from commit ${{ github.sha }}.
          files: Spend-Wisely-1.2.apk
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
